<!DOCTYPE html>
<html>
    <title>DOM Proyects</title>
    <head></head>
    <body>
        <p>YouTube Subscribe Button</p>
        <button onclick="subscribe();" class="js_subcribe_button">Subscribe</button>

        <p>Amazon Shipping Calculator</p>
        <input placeholder="Cost of order" class="js_cost_input">    

        <button onclick="
                calculate_total()
            ">Calculator</button>

        <script>
            function calculate_total() {
                const input_element = document.querySelector('.js_cost_input');
                input_element.value
            }


            function subscribe() {
                let button_element = document.querySelector('.js_subcribe_button'); //Seleccionamos el botón exacto que es subscribe

                if(button_element.innerHTML === 'Subscribe') {  // innerHTML solo selecciona lo que está exacto en el botón, pero qué pasa sin hay un espacio ' '
                    button_element.innerHTML = 'Subscribed';
                } else {                                        // Si hay espaco ocupamos el innerText para usar exactamente lo que queremos
                    button_element.innerHTML = 'Subscribe';
                }
            }

            // Aquí lo importante es que no mezclamos JS con HTML. Esto lo logramos al hacer la función.

        </script> 
    </body>
</html>
