<!DOCTYPE html>
<html>
  <head>
    <title>Advance Functions</title>
  </head>
  <body>
    <script>
      function greeting() {
        console.log('hello')
      }
      greeting();

      const num = 2;
      const function1 = function() {
        console.log('hello2')
      };

      console.log(function1);
      function1();

      const object1 = {
        num: 2,
        fun: function() {
          console.log('hello3'); // Method = función guardada dentro de un objeto
        }
      };
      object1.fun()

      function display(param) {
        console.log(param); // Passing a value into a function
      }
      display(2)

      function run(param) {
        param(); // como param contiene una función, podemos llamarla
      }
      run(function() {
        console.log('hello4')
      })

      setTimeout(function() { //this function use 2 parameters - es un asynchronicus code, o sea, se ejectua antes de la siguiente línea o codigo pero el nex code no wait a que este se muestre
        console.log('timeout'); // 1- function that run in the future
      }, 3000); //how long to wait befre runing the function --> a number in milisecond --> 3000 ms = 3 seg

      console.log('next line')

      setInterval(function() { // esta función mantiene corriendo el código cada 5 segundos
        console.log('interval');
      }, 3000);
    </script>
  </body>
</html>
