<!DOCTYPE html>
<html>
  <head>
    <title>Arrays n' Loops</title>
  </head>
  <body>
    <script>
        const my_array = [10, 20, 30];
        console.log(my_array);            
        console.log(my_array[0]);

        my_array[0] = 99;
        console.log(my_array[0]);

        my_array.push(100);
        console.log(my_array);

        my_array.splice(0, 1);
        console.log(my_array);

        my_array.splice(1, 1)
        console.log(my_array);

        let i = 1;

        while (i <= 5) {
          console.log(i);
          i += 1
        }

        for (let i = 1; i <= 5; i++) {
          console.log(i)
        }

        let random_number = 0;

        while (random_number < 0.5) {
          random_number = Math.random();
        }

        console.log(random_number)

        const to_do_list = [
          'make dinner',
          'wash dishes',
          'watch youtube'
        ];

        for (let i = 0; i <= to_do_list.length -1; i++) { //esto es Looping trough array
          const value = to_do_list[i];
          console.log(value);
        }

        const nums = [1, 1, 3];
        let total = 0; //esta variable es para guardar los resulatados
        for (let i = 0; i < nums.length; i++) {
          const num = nums[i]; // Con esto ingresamos a todos los valores del index de nums, al crear la variable i y declararla
          total = total + num;
        }
        console.log(total) //Con esto creamos el Acumulator Pattern

        const nums_doubled = [];

        for (let i = 0; i < nums.length; i++) {
          const num = nums[i];
          nums_doubled.push(num * 2);
        }
        console.log(nums_doubled)
    </script>
  </body>
</html>
