    <script>

      console.log(my_array);

      }

      }

      for (let i = 0; i < nums.length; i++) {

        total = total + num;
      }
      console.log(total) //Con esto creamos el Acumulator Pattern

        }
      }

          continue;

        console.log(i);

          break;
        }
      }

        if (i % 3 === 0) {
          continue;
        }

        }

        if (ii % 3 === 0) {

        }

      }

        }
        console.log(nums_doubled2);

      doubled_array([1, 1, 3]);
