<!--11v. We'll do the famous FizzBuzz problem. Create a loop that displays 1 to
20 in the console. If the number is divisible by 3, display 'Fizz' instead
of the number. If it's divisible by 5, display 'Buzz' instead. If it's divisible
by 3 and 5, display 'FizzBuzz' instead. (Reminder: divisible by 3 means
num % 3 === 0).
· 1, 2, Fizz, 4, Buzz, Fizz, 7, 8, ... 13, 14, FizzBuzz, 16, 17, ...

11w. Create a copy of exercise 11q, where we created findlndex(). Below it,
create a function unique(array) that takes an array of strings and
returns an array where each string only appears once (there are
no duplicates). Try to use the findlndex() function in your solution.
· unique(['green', 'red', 'blue', 'red']) => ['green', 'red', 'blue']
· unique(['red', 'green', 'green', 'red']) => ['red', 'green']-->

<!DOCTYPE html>
<html>
    <head>
        <title>Lesson 11c</title>
    </head>
    <body>
        <script>
            for (let i = 1; i <= 20; i++) {
                if (i % 3 === 0 && i % 5 === 0) {
                    console.log('FizzBuzz');
                } else if (i % 5 === 0) {
                    console.log('Buzz');
                } else if (i % 3 === 0) {
                    console.log('Fizz');
                } else {
                    console.log(i)
                }
            } 

            let array = ['green', 'red', 'blue', 'red']

            function find_index(array, word) { 
                result = -1;
                for (let i = 0; i < array.length; i++) {
                    if (array[i] === word) {
                        result = i;
                        break;
                    }
                }
                return result;
            };

            function unique(array) {
                let result = [];
                for (let i = 0; i < array.length; i++) {
                    if (find_index(result, array[i]) === -1) {
                        result.push(array[i]);
                    }
                }
                return result;
            }
        </script> 
    </body>
</html>
